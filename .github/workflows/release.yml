name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Package and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create archive
        run: |
          cd dist
          zip -r ../linspector-${{ github.event.release.tag_name }}.zip .

      - name: Attach archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: linspector-${{ github.event.release.tag_name }}.zip
